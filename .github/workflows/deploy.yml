name: Deploy pages

# 提 issue → 自动部署到 GitHub Pages
# 详见 README.md

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发 push 打架。
# queue: max 让最多 100 个 run 排队等待（默认 queue: single 只会保留 1 个 pending，
# 新事件到来时会把排队中的那个顶掉——而被取消的 issue 事件内容就永久丢了）。
concurrency:
  group: pages-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: write # 需要把 sites/ 和 .meta/ 提交回 main
  issues: write # 需要回评 issue
  pages: write # 部署 Pages
  id-token: write # deploy-pages 走 OIDC

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch 只允许从 main 触发，防止把分支内容发到线上
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 配了 DEPLOY_TOKEN 就用 PAT（下游 workflow 会被触发），否则用默认 token
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 解析事件
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/handle_event.py

      - name: 提交内容变更
        id: commit
        if: steps.plan.outputs.changed == 'true'
        env:
          COMMIT_MSG: ${{ steps.plan.outputs.commit_msg }}
        run: bash scripts/commit_push.sh

      # 别的 run 可能刚推了新内容，构建前对齐一次，保证线上是 main 的完整状态
      - name: 对齐到最新 main
        if: steps.plan.outputs.should_deploy == 'true'
        run: |
          git fetch origin main || true
          git reset --hard origin/main || true
          git log --oneline -1

      - name: 构建站点
        id: build
        if: steps.plan.outputs.should_deploy == 'true'
        run: python3 scripts/build_site.py

      # 注意：不要开 include-hidden-files，否则用户 zip 里的 .env 之类会被公开
      - name: 上传 Pages 产物
        id: upload
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        if: steps.plan.outputs.should_deploy == 'true'
        uses: actions/deploy-pages@v5

      - name: 回评 issue
        if: always() && steps.plan.outputs.comment_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_FILE: ${{ steps.plan.outputs.comment_file }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SITE_URL: ${{ steps.plan.outputs.site_url }}
          # 各步骤的真实结果，交给 prepare_comment.py 决定回评里写「成功」还是「失败」
          COMMIT_RESULT: ${{ steps.commit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
        run: |
          if [ -z "${ISSUE_NUMBER}" ] || [ ! -f "${COMMENT_FILE}" ]; then
            echo "无需回评（issue 号为空或没有评论内容）"
            exit 0
          fi
          python3 scripts/prepare_comment.py
          jq -Rs '{body: .}' "${COMMENT_FILE}" \
            | gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --input - \
            > /dev/null
          echo "已回评 issue #${ISSUE_NUMBER}"

      - name: 标记失败
        if: >-
          always() && (
          steps.plan.outputs.status == 'failed' ||
          steps.commit.outcome == 'failure' ||
          steps.build.outcome == 'failure' ||
          steps.upload.outcome == 'failure' ||
          steps.deployment.outcome == 'failure')
        run: |
          echo "::error::部署失败，详见上方日志与 issue 中的回评。"
          exit 1
