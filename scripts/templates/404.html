<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面不存在</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --accent:#6ea8fe; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --fg:#1a1c1f; --dim:#5c6672; --accent:#2563eb; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
          "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  }
  .box { max-width: 480px; text-align: center; }
  .code { font-size: clamp(4rem, 16vw, 7rem); font-weight: 800; letter-spacing: -.05em;
          line-height: 1; margin: 0 0 8px; opacity: .16; }
  h1 { font-size: 1.25rem; margin: 0 0 10px; letter-spacing: -.01em; }
  p { color: var(--dim); margin: 0 0 24px; }
  a.btn {
    display: inline-block; padding: 10px 22px; border-radius: 10px; text-decoration: none;
    color: #fff; background: var(--accent); font-weight: 600; font-size: .92rem;
  }
  @media (prefers-color-scheme: light) { a.btn { color: #fff; } }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>这个页面不存在</h1>
    <p>可能已被删除、下线，或者链接写错了。</p>
    <a class="btn" href="{{BASE}}/">回到首页</a>
  </div>
</body>
</html>
